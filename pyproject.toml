[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gha-audit"
version = "1.1.0"
description = "Offline security auditor for GitHub Actions workflows: unpinned actions, script injection, risky triggers. JSON and SARIF output."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["github-actions", "supply-chain-security", "ci-cd", "devsecops", "sarif"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/gha-audit"

[project.scripts]
gha-audit = "gha_audit:main"

[tool.setuptools]
py-modules = ["gha_audit"]
